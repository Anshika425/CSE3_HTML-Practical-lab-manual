<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Portal</title>
</head>
<body>

    <h2>Breaking News</h2>
    <p>Latest updates from around the world.</p>
    <a href="https://www.bbc.com/news" target="_blank">Read more on BBC</a>

    <h2>Sports Update</h2>
    <p>Highlights of yesterday's football match with thrilling last-minute goals!</p>
    <iframe width="420" height="236"
            src="https://www.youtube.com/embed/aqz-KE-bpKQ"
            title="Sports Highlights"
            allowfullscreen>
    </iframe>
    <hr>

    <h2>Entertainment Buzz</h2>
    <p>New movie trailer released today. Fans are excited!</p>
    <video width="420" height="236" controls>
        <source src="trailer.mp4" type="video/mp4">
    </video>
    <hr>

    <h2>News Podcast</h2>
    <p>Listen to today's top headlines:</p>
    <audio controls>
        <source src="podcast.mp3" type="audio/mpeg">
    </audio>
    <hr>

</body>
</html>

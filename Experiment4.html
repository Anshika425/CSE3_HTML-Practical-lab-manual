<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>

    <form action="#" method="post"
          style="width: 400px; margin: 20px auto; padding: 10px 20px;
                 border: 1px solid black; border-top: 3px solid black;
                 text-align: center;">

        <h2>Hotel Room Booking Form</h2>

        <p>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
        </p>

        <p>
            <label for="checkin">Check-in Date:</label>
            <input type="date" id="checkin" name="checkin">
        </p>

        <p>
            <label for="checkout">Check-out Date:</label>
            <input type="date" id="checkout" name="checkout">
        </p>

        <p>
            <label for="room">Room Type:</label>
            <select id="room" name="room">
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="suite">Suite</option>
            </select>
        </p>

        <p>
            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" min="1" style="width: 60px;">
        </p>

        <p>
            <label for="requests">Special Requests:</label><br>
            <textarea id="requests" name="requests" rows="3" cols="35"></textarea>
        </p>

        <p>
            <button type="submit">Book Now</button>
            <button type="reset">Reset Form</button>
        </p>

    </form>

</body>
</html>
